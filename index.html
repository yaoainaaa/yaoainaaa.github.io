<!DOCTYPE html>
<html>
<head>
  <title>Aina's Garden</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 20px;
      background: #000000;
    }

    h1 {
      text-align: center;
    }

    .grid {
      column-count: 3;
      column-gap: 15px;
    }

    .item {
      break-inside: avoid;
      margin-bottom: 15px;
    }

    img {
      width: 100%;
      border-radius: 8px;
    }

    p {
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>Aina's Moments</h1>

<div class="grid">

  <div class="item">
    <img src="https://picsum.photos/300/400">
    <p>cute mimi</p>
  </div>

  <div class="item">
    <img src="https://picsum.photos/300/500">
  </div>

  <div class="item">
    <img src="https://picsum.photos/300/350">
    <p>always be energetic</p>
  </div>

  <div class="item">
    <img src="https://picsum.photos/300/450">
  </div>

</div>

</body>
</html>
